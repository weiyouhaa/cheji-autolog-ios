name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Xcode Project
        run: |
          brew install xcodegen || true
          xcodegen generate

      - name: Build Unsigned Release App
        run: |
          xcodebuild \
            -project AutoLog.xcodeproj \
            -scheme AutoLog \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/AutoLog.app Payload/
          codesign --force --deep --sign - Payload/AutoLog.app
          zip -r AutoLog.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoLog-iOS-IPA
          path: AutoLog.ipa
